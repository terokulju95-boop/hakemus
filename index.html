<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hakemuspäiväkirja</title>
<style>
  body{background:#0b0e14;color:#e7ebf3;font:16px system-ui;margin:0;padding:20px;}
  .wrap{max-width:920px;margin:auto;}
  .card{background:#141925;border-radius:16px;padding:16px;margin-bottom:20px;border:1px solid #24304a;}
  input,select,button{height:44px;border-radius:10px;border:1px solid #2a3244;background:#0e121a;color:#e7ebf3;padding:0 12px;}
  button{background:#4da3ff;border:none;color:#06111f;font-weight:700;cursor:pointer;}
  .list{display:flex;flex-direction:column;gap:14px;margin-top:14px;}
  .separator{height:4px;background:#4da3ff;border-radius:2px;margin:2px 0;}
  .item{border-radius:14px;padding:16px;border:1px solid;position:relative;}
  .g0{background:#062345;border-color:#1e4b86;}
  .g1{background:#0e381f;border-color:#2a7d59;}
  .g2{background:#2a1238;border-color:#7b3ea1;}
  .g3{background:#3a140e;border-color:#a14a3e;}
  .date{font-weight:800;font-size:18px;letter-spacing:.3px;}
  .company{font-weight:700;font-size:20px;margin-top:3px;}
  .note{color:#dbe2f5;opacity:.95;margin-top:6px;font-size:15px;}
  .delete-btn{
    position:absolute;top:10px;right:12px;
    background:#ff5c7a;color:#06111f;
    width:32px;height:32px;border:none;border-radius:50%;
    font-size:20px;font-weight:800;cursor:pointer;
    line-height:32px;text-align:center;
  }
  .row{display:grid;grid-template-columns:180px 1fr 180px;gap:10px;}
  @media(max-width:700px){.row{grid-template-columns:1fr;}}
  #ownText{display:none;margin-top:8px;}
  #status{
    position:fixed;top:0;left:0;right:0;
    padding:8px;text-align:center;font-size:13px;font-weight:700;
    z-index:999;transition:opacity 0.5s;opacity:0;
  }
  /* Kirjautumisruutu */
  #loginScreen{
    position:fixed;inset:0;background:#0b0e14;
    display:flex;align-items:center;justify-content:center;
    z-index:9999;padding:20px;
  }
  .login-box{
    background:#141925;border-radius:20px;
    padding:36px 28px;width:100%;max-width:360px;
    border:1px solid #24304a;
  }
  .login-title{font-size:24px;font-weight:800;color:#e7ebf3;text-align:center;margin-bottom:6px;}
  .login-sub{font-size:14px;color:#6b7280;text-align:center;margin-bottom:24px;}
  .login-box label{display:block;font-size:13px;font-weight:700;color:#9ca3af;margin-bottom:5px;}
  .login-box input[type="email"],
  .login-box input[type="password"]{
    width:100%;padding:12px 14px;height:auto;
    border:1px solid #2a3244;border-radius:10px;
    background:#0e121a;color:#e7ebf3;
    font-size:16px;margin-bottom:14px;outline:none;
  }
  .login-box input:focus{border-color:#4da3ff;}
  .login-btn{
    width:100%;padding:14px;height:auto;
    background:#4da3ff;color:#06111f;
    border:none;border-radius:10px;
    font-size:17px;font-weight:700;cursor:pointer;margin-bottom:0;
  }
  .login-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .login-error{color:#ff5c7a;font-size:13px;font-weight:700;text-align:center;margin-top:12px;min-height:20px;}
  .user-bar{
    display:flex;justify-content:space-between;align-items:center;
    background:#141925;border:1px solid #24304a;border-radius:10px;
    padding:8px 12px;margin-bottom:15px;font-size:13px;
  }
  .user-bar span{color:#4da3ff;font-weight:600;font-size:12px;}
  .logout-btn{background:none;border:none;color:#ff5c7a;font-size:13px;font-weight:700;cursor:pointer;padding:4px 8px;}
  .logout-btn:hover{text-decoration:underline;}
</style>
<link rel="manifest" href="manifest.json">
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js');
}
</script>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="login-title">🔒 Hakemuspäiväkirja</div>
    <div class="login-sub">Kirjaudu sisään jatkaaksesi</div>
    <label for="emailInput">Sähköposti</label>
    <input type="email" id="emailInput" placeholder="sinun@email.fi" autocomplete="username">
    <label for="passwordInput">Salasana</label>
    <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">Kirjaudu sisään</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>
<div id="status"></div>
<div class="wrap">
<div class="user-bar" id="userBar" style="display:none;">
  <span id="userEmail"></span>
  <button class="logout-btn" onclick="handleLogout()">🚪 Kirjaudu ulos</button>
</div>

<!-- Lomakekortti -->
<div class="card">
  <div class="row">
    <input id="date" type="date"/>
    <input id="company" type="text" placeholder="Yrityksen nimi"/>
    <select id="type">
      <option value="avoinhakemus" selected>avoinhakemus</option>
      <option value="työtarjous">työtarjous</option>
      <option value="yli 2 viikkoa muu kuin työtarjous">yli 2 viikkoa muu kuin työtarjous</option>
      <option value="oma">oma</option>
    </select>
  </div>
  <input id="ownText" type="text" placeholder="Kirjoita oma teksti"/>
  <button id="add" style="width:100%;margin-top:12px;">Lisää kirjaus</button>
</div>

<!-- Export/Import -->
<div class="card" style="display:flex;gap:10px;flex-wrap:wrap;">
  <button id="exportJson" style="flex:1;">Vie JSON</button>
  <button id="importJson" style="flex:1;">Tuo JSON</button>
  <input type="file" id="fileInput" accept="application/json" style="display:none;">
</div>

<!-- Lista -->
<div id="list" class="list"><p style="color:#6b7280;text-align:center">Ladataan...</p></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDswdEF9J0gsHJH6Zo_8BGZrf8DVG3FwYc",
  authDomain: "hakemuspaivakirja.firebaseapp.com",
  projectId: "hakemuspaivakirja",
  storageBucket: "hakemuspaivakirja.firebasestorage.app",
  messagingSenderId: "836133210317",
  appId: "1:836133210317:web:d85131ae272ecf1938c184"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const DATA_DOC = doc(db, "hakemus", "data");

let items = [];
let isSaving = false;

// ============================
// STATUS
// ============================
function showStatus(msg, color){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.background = color || '#4da3ff';
  el.style.color = '#06111f';
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2000);
}

// ============================
// FIREBASE TALLENNUS
// ============================
async function save(){
  if(isSaving) return;
  isSaving = true;
  showStatus('💾 Tallennetaan...', '#f97316');
  try {
    // Varmuuskopio localStorageen
    localStorage.setItem('hakemus_bkp', JSON.stringify(items));
    await setDoc(DATA_DOC, { json: JSON.stringify(items) });
    showStatus('✅ Tallennettu', '#22c55e');
  } catch(e) {
    showStatus('❌ Tallennus epäonnistui', '#dc2626');
    console.error(e);
  }
  isSaving = false;
}

// ============================
// LATAUS
// ============================
async function loadData(){
  try {
    const snap = await getDoc(DATA_DOC);
    if(snap.exists()){
      items = JSON.parse(snap.data().json) || [];
    } else {
      // Ensimmäinen käyttökerta – tarkista onko localStoragessa vanhaa dataa
      const bkp = localStorage.getItem('hakemus_bkp') || localStorage.getItem('hakemus_items_final_v5');
      if(bkp){
        try {
          items = JSON.parse(bkp);
          await save(); // Siirrä vanha data Firebaseen
          showStatus('✅ Vanha data siirretty pilveen!', '#22c55e');
        } catch(e){ items = []; }
      }
    }
  } catch(e) {
    // Verkkovirhe – käytä paikallista varmuuskopiota
    const bkp = localStorage.getItem('hakemus_bkp');
    if(bkp) try { items = JSON.parse(bkp); } catch(e2){}
    showStatus('⚠️ Yhteysvirhe – paikallinen data', '#f59e0b');
  }
  render();

  // Kuuntele reaaliaikaisia muutoksia (esim. toiselta laitteelta)
  onSnapshot(DATA_DOC, snap => {
    if(!snap.exists() || isSaving) return;
    try {
      items = JSON.parse(snap.data().json) || [];
      render();
    } catch(e){}
  });
}

// ============================
// APUFUNKTIOT
// ============================
function getLocalDate(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,10);
}

function formatDateFi(iso){
  if(!iso) return "";
  const parts = iso.split("-");
  if(parts.length !== 3) return iso;
  const [y,m,d] = parts;
  return `${d}.${m}.${y.slice(-2)}`;
}

function setToday(){
  document.getElementById("date").value = getLocalDate();
}
setToday();

// ============================
// RENDER
// ============================
function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  if(!items.length){
    list.innerHTML = '<p style="color:#6b7280;text-align:center">Ei kirjauksia vielä.</p>';
    return;
  }
  const N = items.length;
  const offset = ((N % 4) === 0 ? 4 : (N % 4)) - 1;

  items.forEach((it, i) => {
    const groupFromBottom = Math.floor((N - 1 - i) / 4);
    const colorClass = "g" + (groupFromBottom % 4);
    const card = document.createElement("div");
    card.className = "item " + colorClass;
    card.innerHTML = `
      <button class="delete-btn" data-i="${i}">×</button>
      <div class="date">${formatDateFi(it.date)}</div>
      <div class="company">${it.company}</div>
      <div class="note">${it.note}</div>
    `;
    list.appendChild(card);

    if(i === offset || ((i - offset) % 4 === 0 && i > offset && i < N - 1)){
      if(i < N - 1){
        const sep = document.createElement("div");
        sep.className = "separator";
        list.appendChild(sep);
      }
    }
  });

  // Poisto-napit
  list.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', () => removeItem(+btn.dataset.i));
  });
}

// ============================
// LISÄÄ
// ============================
document.getElementById("type").addEventListener("change", () => {
  const own = document.getElementById("ownText");
  own.style.display = (document.getElementById("type").value === "oma") ? "block" : "none";
});

document.getElementById("add").onclick = async () => {
  const date = document.getElementById("date").value || getLocalDate();
  const company = document.getElementById("company").value.trim();
  if(!company) return;

  let type = document.getElementById("type").value;
  if(type === "oma"){
    const t = document.getElementById("ownText").value.trim();
    if(!t) return;
    type = t;
  }

  const note = type + " rakennusmies";
  items.unshift({date, company, note});
  document.getElementById("company").value = "";
  document.getElementById("ownText").value = "";
  setToday();
  render();
  await save();
};

// ============================
// POISTA
// ============================
async function removeItem(i){
  if(!confirm("Haluatko varmasti poistaa tämän merkinnän?")) return;
  items.splice(i, 1);
  render();
  await save();
}

// ============================
// VIE / TUO JSON
// ============================
document.getElementById("exportJson").onclick = () => {
  const blob = new Blob([JSON.stringify(items, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "hakemuspaivakirja_backup.json";
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById("importJson").onclick = () => {
  document.getElementById("fileInput").click();
};

document.getElementById("fileInput").onchange = async (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const parsed = JSON.parse(evt.target.result);
      if(!Array.isArray(parsed)){ alert("Virheellinen JSON."); return; }
      items = parsed;
      render();
      await save();
      alert("Tiedot tuotu onnistuneesti.");
    } catch(err){
      alert("Tiedoston lukeminen epäonnistui.");
    }
  };
  reader.readAsText(file);
};

// ============================
// AUTH STATE
// ============================
onAuthStateChanged(auth, user => {
  if(user){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('userBar').style.display = 'flex';
    document.getElementById('userEmail').textContent = user.email;
    loadData();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('userBar').style.display = 'none';
    document.getElementById('list').innerHTML = '<p style="color:#6b7280;text-align:center">Ladataan...</p>';
  }
});

// ============================
// KIRJAUTUMINEN
// ============================
window.handleLogin = async () => {
  const email    = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const btn      = document.getElementById('loginBtn');
  const err      = document.getElementById('loginError');
  if(!email || !password){ err.textContent = "Syötä sähköposti ja salasana."; return; }
  btn.disabled = true;
  btn.textContent = "Kirjaudutaan...";
  err.textContent = "";
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(e){
    btn.disabled = false;
    btn.textContent = "Kirjaudu sisään";
    if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'){
      err.textContent = "Väärä sähköposti tai salasana.";
    } else if(e.code === 'auth/too-many-requests'){
      err.textContent = "Liian monta yritystä. Yritä myöhemmin.";
    } else {
      err.textContent = "Kirjautuminen epäonnistui. (" + e.code + ")";
    }
  }
};

document.getElementById('passwordInput').addEventListener('keydown', e => { if(e.key==='Enter') window.handleLogin(); });
document.getElementById('emailInput').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('passwordInput').focus(); });

// ============================
// ULOSKIRJAUTUMINEN
// ============================
window.handleLogout = async () => {
  if(confirm('Haluatko kirjautua ulos?')) await signOut(auth);
};
</script>

</body>
</html>
